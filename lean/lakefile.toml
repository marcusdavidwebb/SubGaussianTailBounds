name = "singularValueBounds"
version = "0.1.0"
defaultTargets = ["SingularValueBounds"]

# Portable template: ./setup.sh resolves these paths in an external workspace.
# Run ./check.sh instead of invoking Lake in this source directory.
buildDir = "@SVB_BUILD_DIR@"
packagesDir = "@SVB_PACKAGES_DIR@"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "SingularValueBounds"
# The resolved configuration uses the canonical source root, without a copy.
srcDir = "@SVB_SOURCE_DIR@"
