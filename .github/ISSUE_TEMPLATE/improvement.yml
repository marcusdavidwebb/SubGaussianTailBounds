name: Discuss a Lean formalization contribution
description: Discuss a stronger quartet or an alternative proof at the current constants.
title: "[Lean] "
body:
  - type: markdown
    attributes:
      value: |
        Contributions require complete Lean proofs of either canonical result,
        with no component exceeding its currently accepted value. Equal-constant
        replacements are eligible for review. Preserve the other regime and
        prove all baseline and trusted-current comparisons. No separate prose
        proof or external numerical certificate is required.
  - type: textarea
    id: claim
    attributes:
      label: Proposed values and range
      description: Identify the regime and complete exact quartet under the unchanged canonical hypotheses.
    validations:
      required: true
  - type: textarea
    id: argument
    attributes:
      label: Lean declarations and explanation
      description: Identify the proposed formalization, comparison proofs, reuse and relevant sources.
    validations:
      required: true
  - type: textarea
    id: credit
    attributes:
      label: Attribution and assistance
      description: Credit prior work, contributors, and any AI assistance.
