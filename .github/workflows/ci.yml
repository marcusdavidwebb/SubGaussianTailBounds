name: Verification

on:
  # The workflow is taken from the trusted base, so a PR cannot disable its gate.
  # Candidate code runs only in read-only jobs on disposable hosted runners.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

jobs:
  announce:
    name: Start required status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # This isolated writer never checks out or executes contributor code.
      - name: Mark the exact candidate commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha, repo = os.environ['TARGET_SHA'], os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid trusted commit context')
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data = json.dumps({'state': 'pending', 'context': 'CI required',
                             'description': 'Complete canonical Lean verification is running',
                             'target_url': url}).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                  'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Required status pending:', response.status)
          PY

  preflight:
    name: Source and contribution preflight
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Require a current head and accepted base
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/ci_context.py --event "$GITHUB_EVENT_PATH"
      - name: Check immutable source and contribution history with trusted policy
        env:
          BASE_REF: ${{ steps.context.outputs.base_ref }}
        run: |
          args=(--root "$GITHUB_WORKSPACE/candidate" --trusted-root "$GITHUB_WORKSPACE/trusted")
          if [[ -n "$BASE_REF" ]]; then args+=(--base-ref "$BASE_REF"); fi
          python3 trusted/scripts/check_contributions.py "${args[@]}"
      - name: Test trusted administrative rejection cases
        run: python3 -m unittest discover -s trusted/tests -v

  build_plan:
    name: Plan cold compilation
    needs: [announce, preflight]
    # Configure a suitably sized GitHub-hosted Linux runner label if required.
    runs-on: ${{ vars.LEAN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checkpoint_id: ${{ steps.checkpoint.outputs.artifact-id }}
    env:
      SVB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SVB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_SOURCE_ROOT: ${{ github.workspace }}/candidate
      SVB_TRUSTED_ROOT: ${{ github.workspace }}/trusted
      SVB_BUILD_JOBS: '1'
    steps:
      - name: Select external job-specific workspaces
        run: |
          printf 'SVB_WORK_DIR=%s/candidate-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_ARTIFACT_DIR=%s/proof-modules\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Check provenance before candidate setup
        run: >-
          python3 trusted/scripts/generate_lean_acceptance.py --root "$SVB_SOURCE_ROOT"
          --trusted-root "$SVB_TRUSTED_ROOT" --check-inputs-only
      - name: Install checksum-pinned Elan on this disposable runner
        run: bash trusted/scripts/install_ci_lean.sh
      - name: Provision exact locked dependencies in the isolated build job
        run: candidate/lean/setup.sh --ci
      - name: Partition the complete source dependency graph
        run: bash trusted/scripts/ci_lean.sh build init
      - name: Export build-plan
        id: checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output/checkpoint.json
          if-no-files-found: error
          retention-days: 3

  build_stage_a:
    name: Compile dependency stage 1/8
    needs: [build_plan]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 0
      checkpoint_id: ${{ needs.build_plan.outputs.checkpoint_id }}

  build_stage_b:
    name: Compile dependency stage 2/8
    needs: [build_stage_a]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 1
      checkpoint_id: ${{ needs.build_stage_a.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_a.outputs.payload_id }}

  build_stage_c:
    name: Compile dependency stage 3/8
    needs: [build_stage_b]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 2
      checkpoint_id: ${{ needs.build_stage_b.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_b.outputs.payload_id }}

  build_stage_d:
    name: Compile dependency stage 4/8
    needs: [build_stage_c]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 3
      checkpoint_id: ${{ needs.build_stage_c.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_c.outputs.payload_id }}

  build_stage_e:
    name: Compile dependency stage 5/8
    needs: [build_stage_d]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 4
      checkpoint_id: ${{ needs.build_stage_d.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_d.outputs.payload_id }}

  build_stage_f:
    name: Compile dependency stage 6/8
    needs: [build_stage_e]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 5
      checkpoint_id: ${{ needs.build_stage_e.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_e.outputs.payload_id }}

  build_stage_g:
    name: Compile dependency stage 7/8
    needs: [build_stage_f]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 6
      checkpoint_id: ${{ needs.build_stage_f.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_f.outputs.payload_id }}

  build_stage_h:
    name: Compile dependency stage 8/8
    needs: [build_stage_g]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: build
      stage: 7
      checkpoint_id: ${{ needs.build_stage_g.outputs.checkpoint_id }}
      payload_id: ${{ needs.build_stage_g.outputs.payload_id }}

  build:
    name: Isolated candidate compilation
    needs: [announce, preflight, build_stage_h]
    # Configure a suitably sized GitHub-hosted Linux runner label if required.
    runs-on: ${{ vars.LEAN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.modules.outputs.artifact-id }}
    env:
      SVB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SVB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_SOURCE_ROOT: ${{ github.workspace }}/candidate
      SVB_TRUSTED_ROOT: ${{ github.workspace }}/trusted
      SVB_BUILD_JOBS: '1'
    steps:
      - name: Select external job-specific workspaces
        run: |
          printf 'SVB_WORK_DIR=%s/candidate-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_ARTIFACT_DIR=%s/proof-modules\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Check provenance before candidate setup
        run: >-
          python3 trusted/scripts/generate_lean_acceptance.py --root "$SVB_SOURCE_ROOT"
          --trusted-root "$SVB_TRUSTED_ROOT" --check-inputs-only
      - name: Install checksum-pinned Elan on this disposable runner
        run: bash trusted/scripts/install_ci_lean.sh
      - name: Provision exact locked dependencies in the isolated build job
        run: candidate/lean/setup.sh --ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build_stage_h.outputs.payload_id }}
          path: ${{ runner.temp }}/candidate-work/.lake/build
          merge-multiple: true
      # This command builds the maintained library as well as the obligations.
      # The isolated audit below checks complete source coverage and axioms;
      # repeating that full-library diagnostic here doubles its loading work.
      - name: Build the maintained library and exact acceptance obligations
        run: |
          set -o pipefail
          free -h
          df -h "$RUNNER_TEMP"
          /usr/bin/time -v bash trusted/lean/check_acceptance.sh build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Test canonical gate rejection fixtures with the installed Lean
        env:
          SVB_LEAN_TEST_WORK_DIR: ${{ runner.temp }}/candidate-work
        run: |
          python3 -m unittest discover -s trusted/tests -p test_lean_acceptance.py -v
          python3 -m unittest discover -s trusted/tests -p test_module_replay_integration.py -v
          python3 -m unittest discover -s trusted/tests -p test_snapshot_source.py -v
          python3 -m unittest discover -s trusted/tests -p test_build_lean_modules.py -v
          python3 -m unittest discover -s trusted/tests -p test_ci_lean_build.py -v
          python3 -m unittest discover -s trusted/tests -p test_ci_lean_audit.py -v
      - name: Export data-only compiled modules for independent checking
        id: modules
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-proof-modules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-modules
          if-no-files-found: error
          retention-days: 7
      - name: Preserve candidate build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

  snapshot:
    name: Isolated next-constants compilation
    needs: [announce, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.constants.outputs.artifact-id }}
    env:
      SVB_SOURCE_ROOT: ${{ github.workspace }}/candidate
      SVB_TRUSTED_ROOT: ${{ github.workspace }}/trusted
    steps:
      - name: Select external job-specific workspaces
        run: |
          printf 'SVB_WORK_DIR=%s/snapshot-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_ARTIFACT_DIR=%s/snapshot-module\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Install checksum-pinned Elan on this disposable runner
        run: bash trusted/scripts/install_ci_lean.sh
      - name: Provision the trusted pinned compiler and dependencies
        run: trusted/lean/setup.sh --ci
      - name: Independently compile only the candidate's standalone constants source
        run: bash trusted/lean/check_acceptance.sh snapshot
      - name: Export the independently compiled next snapshot
        id: constants
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-next-constants-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-module
          if-no-files-found: error
          retention-days: 7

  audit_plan:
    name: Plan independent kernel replay
    needs: [announce, preflight, build, snapshot]
    runs-on: ${{ vars.LEAN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checkpoint_id: ${{ steps.checkpoint.outputs.artifact-id }}
    env:
      SVB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SVB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_SOURCE_ROOT: ${{ github.workspace }}/candidate
      SVB_TRUSTED_ROOT: ${{ github.workspace }}/trusted
    steps:
      - name: Select external job-specific workspaces
        run: |
          printf 'SVB_WORK_DIR=%s/trusted-audit-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_PROOF_ARTIFACT_DIR=%s/download-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_SNAPSHOT_ARTIFACT_DIR=%s/download-snapshot\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Install checksum-pinned Elan on this disposable runner
        run: bash trusted/scripts/install_ci_lean.sh
      - name: Provision an independent trusted compiler and Mathlib
        run: trusted/lean/setup.sh --ci
      - name: Download only this build's artifact by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/download-proof
          merge-multiple: true
      - name: Download only the independent snapshot artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.snapshot.outputs.artifact_id }}
          path: ${{ runner.temp }}/download-snapshot
          merge-multiple: true
      - name: Prepare the independent verifier and plan every compiled module
        run: |
          bash trusted/lean/check_acceptance.sh audit-prepare
          bash trusted/scripts/ci_lean.sh audit init
      - name: Export audit-plan
        id: checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output/checkpoint.json
          if-no-files-found: error
          retention-days: 3

  audit_stage_a:
    name: Replay dependency stage 1/8
    needs: [audit_plan, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 0
      checkpoint_id: ${{ needs.audit_plan.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_b:
    name: Replay dependency stage 2/8
    needs: [audit_stage_a, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 1
      checkpoint_id: ${{ needs.audit_stage_a.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_c:
    name: Replay dependency stage 3/8
    needs: [audit_stage_b, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 2
      checkpoint_id: ${{ needs.audit_stage_b.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_d:
    name: Replay dependency stage 4/8
    needs: [audit_stage_c, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 3
      checkpoint_id: ${{ needs.audit_stage_c.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_e:
    name: Replay dependency stage 5/8
    needs: [audit_stage_d, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 4
      checkpoint_id: ${{ needs.audit_stage_d.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_f:
    name: Replay dependency stage 6/8
    needs: [audit_stage_e, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 5
      checkpoint_id: ${{ needs.audit_stage_e.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_g:
    name: Replay dependency stage 7/8
    needs: [audit_stage_f, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 6
      checkpoint_id: ${{ needs.audit_stage_f.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit_stage_h:
    name: Replay dependency stage 8/8
    needs: [audit_stage_g, build, snapshot]
    permissions:
      contents: read
    uses: ./.github/workflows/lean-stage.yml
    with:
      mode: audit
      stage: 7
      checkpoint_id: ${{ needs.audit_stage_g.outputs.checkpoint_id }}
      proof_id: ${{ needs.build.outputs.artifact_id }}
      snapshot_id: ${{ needs.snapshot.outputs.artifact_id }}

  audit:
    name: Trusted canonical kernel audit
    needs: [announce, preflight, build, snapshot, audit_stage_h]
    runs-on: ${{ vars.LEAN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SVB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SVB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_SOURCE_ROOT: ${{ github.workspace }}/candidate
      SVB_TRUSTED_ROOT: ${{ github.workspace }}/trusted
    steps:
      - name: Select external job-specific workspaces
        run: |
          printf 'SVB_WORK_DIR=%s/trusted-audit-work\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_PROOF_ARTIFACT_DIR=%s/download-proof\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SVB_SNAPSHOT_ARTIFACT_DIR=%s/download-snapshot\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Check out exact candidate and trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Install checksum-pinned Elan on this disposable runner
        run: bash trusted/scripts/install_ci_lean.sh
      - name: Provision an independent trusted compiler and Mathlib
        run: trusted/lean/setup.sh --ci
      - name: Download only this build's artifact by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/download-proof
          merge-multiple: true
      - name: Download only the independent snapshot artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.snapshot.outputs.artifact_id }}
          path: ${{ runner.temp }}/download-snapshot
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.audit_stage_h.outputs.checkpoint_id }}
          path: ${{ runner.temp }}/checkpoint
          merge-multiple: true
      - name: Check complete replay receipts and all exact canonical obligations
        run: |
          set -o pipefail
          bash trusted/lean/check_acceptance.sh audit-prepare
          bash trusted/scripts/ci_lean.sh audit final 2>&1 | tee "$RUNNER_TEMP/canonical-audit.log"
          python3 trusted/lean/check_axiom_audit.py --source-dir "$SVB_SOURCE_ROOT/lean" < "$RUNNER_TEMP/canonical-audit.log"
          grep -qx 'CANONICAL_ACCEPTANCE_COMPLETE 22 targets' "$RUNNER_TEMP/canonical-audit.log"
      - name: Preserve the authoritative audit log and trusted generated obligations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/canonical-audit.log
            ${{ runner.temp }}/trusted-audit-work/acceptance/audit-prepare/CanonicalAcceptance.lean
            ${{ runner.temp }}/trusted-audit-work/acceptance/audit-prepare/CanonicalAcceptanceExpected.lean
            ${{ runner.temp }}/trusted-audit-work/acceptance/audit-prepare/CanonicalTrustedConstants.lean
          if-no-files-found: ignore

  required:
    name: Report required status
    if: always()
    needs: [announce, preflight, build_plan, build_stage_a, build_stage_b, build_stage_c, build_stage_d, build_stage_e, build_stage_f, build_stage_g, build_stage_h, build, snapshot, audit_plan, audit_stage_a, audit_stage_b, audit_stage_c, audit_stage_d, audit_stage_e, audit_stage_f, audit_stage_g, audit_stage_h, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          sha, repo = os.environ['TARGET_SHA'], os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid trusted commit context')
          # Recheck after the long Lean job: a newer target branch may contain
          # improved accepted constants. Never report success for a stale base.
          number, base = os.environ.get('PR_NUMBER', ''), os.environ.get('EXPECTED_BASE_SHA', '')
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}
          if number:
              if not re.fullmatch(r'[1-9][0-9]*', number) or not re.fullmatch(r'[0-9a-f]{40}', base):
                  raise SystemExit('Invalid trusted pull request context')
              live_request = urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{number}',
                                                    headers=headers)
              with urllib.request.urlopen(live_request, timeout=30) as response:
                  live = json.load(response)
              if live['head']['sha'] != sha or live['base']['sha'] != base:
                  failed['stale_revision'] = 'Head or accepted base advanced; rerun current comparison'
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data = json.dumps({'state': 'failure' if failed else 'success', 'context': 'CI required',
              'description': 'Required verification failed' if failed else 'All verification jobs passed',
              'target_url': url}).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                  'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Reported required commit status:', response.status)
          if failed:
              raise SystemExit(f'Required verification jobs did not succeed: {failed}')
          print('PASS: complete canonical Lean targets, current/baseline comparisons, and trusted kernel audit.')
          PY
