name: Verification

on:
  # The workflow is taken from the trusted base, so a PR cannot disable its gate.
  # Candidate code runs only in read-only jobs on disposable hosted runners.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

jobs:
  announce:
    name: Start required status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # This isolated writer never checks out or executes contributor code.
      - name: Mark the exact candidate commit pending
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          sha, repo = os.environ['TARGET_SHA'], os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid trusted commit context')
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data = json.dumps({'state': 'pending', 'context': 'CI required',
                             'description': 'Complete contribution verification is running',
                             'target_url': url}).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                  'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Required status pending:', response.status)
          PY

  contribution:
    name: Contribution completeness
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      base_ref: ${{ steps.context.outputs.base_ref }}
      maintenance: ${{ steps.context.outputs.maintenance }}
    steps:
      - name: Check out candidate merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the exact head merged with the event's base
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Check out trusted base policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Resolve commit-specific maintainer authorization
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 trusted/scripts/ci_context.py
          --event "$GITHUB_EVENT_PATH"
          --trusted-root "$GITHUB_WORKSPACE/trusted"
      - name: Enforce complete contribution package with trusted validator
        env:
          BASE_REF: ${{ steps.context.outputs.base_ref }}
          MAINTENANCE: ${{ steps.context.outputs.maintenance }}
        run: |
          args=(--root "$GITHUB_WORKSPACE/candidate"
                --generate-lean "$RUNNER_TEMP/ContributionTargets.lean")
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF" --repository-root "$GITHUB_WORKSPACE/candidate")
          fi
          if [[ "$MAINTENANCE" == true ]]; then args+=(--maintenance); fi
          python3 trusted/scripts/check_contributions.py "${args[@]}"
      - name: Test rejection cases and authorization
        working-directory: candidate
        run: python3 -m unittest discover -s tests -v

  certificates:
    name: Exact certificates
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Check every exact certificate and interface
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          ./lean/check_certificates.sh 2>&1 | tee "$RUNNER_TEMP/certificates.log"
      - name: Preserve verification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-certificates-${{ github.run_id }}
          path: ${{ runner.temp }}/certificates.log
          if-no-files-found: ignore

  lean:
    name: Lean verification
    needs: [announce, contribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Generate exact claimed theorem targets with trusted validator
        env:
          BASE_REF: ${{ needs.contribution.outputs.base_ref }}
          MAINTENANCE: ${{ needs.contribution.outputs.maintenance }}
        run: |
          args=(--root "$GITHUB_WORKSPACE/candidate"
                --generate-lean "$RUNNER_TEMP/ContributionTargets.lean")
          if [[ -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF" --repository-root "$GITHUB_WORKSPACE/candidate")
          fi
          if [[ "$MAINTENANCE" == true ]]; then args+=(--maintenance); fi
          python3 trusted/scripts/check_contributions.py "${args[@]}"
      - name: Install checksum-pinned Elan on the disposable runner
        run: |
          echo "SVB_WORK_DIR=$RUNNER_TEMP/svb-work" >> "$GITHUB_ENV"
          echo "MATHLIB_CACHE_DIR=$RUNNER_TEMP/mathlib-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/elan-installer"
          cd "$RUNNER_TEMP/elan-installer"
          curl --fail --location --retry 3 --output elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz
          printf '%s\n' 'f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Provision the exact locked dependencies externally
        working-directory: candidate
        run: ./lean/setup.sh --ci
      - name: Build, audit and check the claimed theorem types
        working-directory: candidate
        env:
          SVB_EXTRA_LEAN: ${{ runner.temp }}/ContributionTargets.lean
        run: |
          set -o pipefail
          ./lean/check.sh 2>&1 | tee "$RUNNER_TEMP/lean.log"
      - name: Preserve generated targets and verification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ContributionTargets.lean
            ${{ runner.temp }}/lean.log
          if-no-files-found: ignore

  document:
    name: Supplement build
    needs: announce
    permissions:
      contents: read
    uses: ./.github/workflows/supplement.yml

  required:
    name: Report required status
    if: always()
    needs: [announce, contribution, certificates, lean, document]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Require every verification job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          sha, repo = os.environ['TARGET_SHA'], os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or not re.fullmatch(r'[\w.-]+/[\w.-]+', repo):
              raise SystemExit('Invalid trusted commit context')
          url = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          data = json.dumps({'state': 'failure' if failed else 'success', 'context': 'CI required',
              'description': 'Required verification failed' if failed else 'All verification jobs passed',
              'target_url': url}).encode()
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/statuses/{sha}',
              data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                  'Accept': 'application/vnd.github+json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('Reported required commit status:', response.status)
          if failed:
              raise SystemExit(f'Required verification jobs did not succeed: {failed}')
          print('PASS: complete contribution, exact certificates, Lean and supplement checks.')
          PY
