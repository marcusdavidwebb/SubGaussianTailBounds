name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  SVB_LEAN_TEST_WORK_DIR: ''

jobs:
  administrative:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.0'
      - name: Check source presentation and attribution
        run: python3 scripts/check_contributions.py
      - name: Check generated theorem
        run: python3 scripts/generate_theorem_tex.py --check
      - name: Check generated proof sources
        run: |
          python3 scripts/generate_general_mean.py --check
          python3 scripts/generate_endpoint_entropy.py --check
          python3 scripts/generate_polynomial_certificates.py --check
      - name: Administrative regression tests
        run: python3 -m unittest discover -s tests -v
# This job neither installs Lean nor verifies proofs. Run ./lean/verify.sh locally.
