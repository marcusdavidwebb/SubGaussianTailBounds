name: Lean dependency stage
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      stage:
        type: number
        required: true
      checkpoint_id:
        type: string
        required: true
      payload_id:
        type: string
        default: ''
      proof_id:
        type: string
        default: ''
      snapshot_id:
        type: string
        default: ''
    outputs:
      checkpoint_id:
        value: ${{ jobs.combine.outputs.checkpoint_id }}
      payload_id:
        value: ${{ jobs.combine.outputs.payload_id }}
permissions: {}
jobs:
  shard_0:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 0
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_1:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 1
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_2:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 2
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_3:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 3
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_4:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 4
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_5:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 5
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_6:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 6
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  shard_7:
    permissions:
      contents: read
    uses: ./.github/workflows/lean-shard.yml
    with:
      mode: ${{ inputs.mode }}
      stage: ${{ inputs.stage }}
      shard: 7
      checkpoint_id: ${{ inputs.checkpoint_id }}
      payload_id: ${{ inputs.payload_id }}
      proof_id: ${{ inputs.proof_id }}
      snapshot_id: ${{ inputs.snapshot_id }}
  combine:
    name: Require all eight shards and advance the checkpoint
    needs: [shard_0, shard_1, shard_2, shard_3, shard_4, shard_5, shard_6, shard_7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      checkpoint_id: ${{ steps.checkpoint.outputs.artifact-id }}
      payload_id: ${{ steps.payload.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: ''
      SVB_STAGE: ${{ inputs.stage }}
      SVB_WORK_DIR: ${{ runner.temp }}/trusted-audit-work
      SVB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SVB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SVB_POLICY_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: trusted
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.checkpoint_id }}
          path: ${{ runner.temp }}/checkpoint
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_0.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/0
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_1.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/1
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_2.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/2
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_3.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/3
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_4.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/4
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_5.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/5
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_6.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/6
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.shard_7.outputs.artifact_id }}
          path: ${{ runner.temp }}/fragments/7
          merge-multiple: true
      - name: Download the preceding compilation fragments
        if: inputs.mode == 'build' && inputs.payload_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.payload_id }}
          path: ${{ runner.temp }}/prior-build
          merge-multiple: true
      - name: Validate complete stage coverage and combine results
        env:
          MODE: ${{ inputs.mode }}
        run: bash trusted/scripts/ci_lean.sh "$MODE" merge
      - name: Export ${{ inputs.mode }}-checkpoint-${{ inputs.stage }}
        id: checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.mode }}-checkpoint-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output/checkpoint.json
          if-no-files-found: error
          retention-days: 3
      - name: Export cumulative compilation data
        if: inputs.mode == 'build'
        id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-data-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output/build
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
