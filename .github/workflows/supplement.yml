name: Supplement build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

# Optional manual rebuild of the historical supplement.
# It is not called by canonical Lean CI and never reports its required status.
jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the event's base into the exact candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git -C candidate -c user.name='Verification CI' -c user.email='ci@users.noreply.github.com' \
              merge --no-commit --no-ff "$BASE_REF"
          fi
      - name: Install LaTeX build tools
        shell: bash
        run: |
          # Prefer Ubuntu's main HTTPS archive: the Azure mirror can stall
          # long enough to exhaust this job before compilation even starts.
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'https://azure.archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_options=(-o Acquire::Retries=3
                       -o Acquire::http::Timeout=30
                       -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" \
            install --no-install-recommends -y \
            latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Build the standalone supplement
        working-directory: candidate
        run: ./scripts/build_supplement.sh
      - name: Preserve PDF and LaTeX log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supplement-${{ github.run_id }}
          path: |
            candidate/supplementary.pdf
            candidate/build/latex/supplementary.log
          if-no-files-found: ignore
