name = "singularValueBounds"
version = "0.1.0"
defaultTargets = ["SingularValueBounds.CheckStatements"]
# Bound per-module proof parallelism for large exact certificate tables.
weakLeanArgs = ["-j2"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.33.1"

[[require]]
name = "NLAlib"
git = "https://github.com/NLA-lib/NLAlib.git"
rev = "6491e7528c1b1e68e46301cde6a76ae153e8e834"

[[lean_lib]]
name = "SingularValueBounds"
srcDir = "lean"

[[lean_lib]]
name = "MainTheoremStatement"
srcDir = "."
